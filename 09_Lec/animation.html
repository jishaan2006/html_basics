<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            background-color: #ff0000;
            height: 200px; 
            width: 300px;
            animation-name: any;   
            animation-duration: 5s;    
            animation-iteration-count: 4;
            animation-delay: 3s;
        }
        @keyframes any{
            0%{
                background-color: black;
                height: 400px;
                width: 400px;
                border-radius: 40px;
            }
            25%{
                background-color: aqua;
                height: 100vh;
                width: 50vw;
                
            }
            50%{
                background-color: gold;
                border-radius: 50%;
            }
        }
        
    </style>
</head>
<body>
    <div>

    </div>
</body>
</html>
